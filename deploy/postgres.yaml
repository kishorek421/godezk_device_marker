# PostgreSQL for godezk_device_marker — in-cluster instance.
# Hand this to the DevOps repo: k8s/services/device_marker/ (base or overlay).
# Adjust namespace + storage class to match the cluster.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: device-marker-postgres
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: device-marker-postgres
spec:
  serviceName: device-marker-postgres
  replicas: 1
  selector:
    matchLabels:
      app: device-marker-postgres
  template:
    metadata:
      labels:
        app: device-marker-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "godezk"
            - name: POSTGRES_USER
              value: "godezk_app"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: device-marker-secrets
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "godezk_app", "-d", "godezk"]
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: device-marker-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: device-marker-postgres
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: device-marker-postgres
