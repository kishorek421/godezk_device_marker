# PostgreSQL for device-marker — mirrors the cluster's per-app pattern
# (postgres:15-alpine, ClusterIP svc, small local-path PVC — same as
# mlops-postgres / attendance / vehicle / task-manager deployments).
# Drop under k8s/services/device_marker/base/ in the devops repo.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: device-marker-postgres
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: device-marker-postgres
  labels:
    app: device-marker-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate          # single-writer; avoid concurrent pods on one PVC
  selector:
    matchLabels:
      app: device-marker-postgres
  template:
    metadata:
      labels:
        app: device-marker-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: device-marker-postgres-secret
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: device-marker-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: device-marker-postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: device-marker-postgres
