# Secrets for device-marker — task-manager style (5 keys) so Postgres
# self-initializes on first boot AND the backend can consume the same
# secret via envFrom/secretKeyRef. Also carries a full `url` key so
# anything wanting a conn string (mlops pattern) works too.
#
# Fill real values, kubectl apply, keep filled values OUT of git.
# Generate: openssl rand -base64 32 / 64
apiVersion: v1
kind: Secret
metadata:
  name: device-marker-postgres-secret
type: Opaque
stringData:
  POSTGRES_DB: "marker_db"
  POSTGRES_USER: "marker_user"
  POSTGRES_PASSWORD: "REPLACE_ME_STRONG_PASSWORD"
  # convenience conn-string (same pattern as mlops-postgres-secret `url`)
  url: "postgresql://marker_user:REPLACE_ME_STRONG_PASSWORD@device-marker-postgres:5432/marker_db"
---
apiVersion: v1
kind: Secret
metadata:
  name: device-marker-secrets
type: Opaque
stringData:
  django-secret-key: "REPLACE_ME_64_RANDOM_CHARS"
