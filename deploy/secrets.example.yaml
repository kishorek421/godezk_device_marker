# Secrets for device-marker. Create once per environment —
# fill real values, apply, then DELETE this file's values from git.
# Generate values:
#   django-secret-key : openssl rand -base64 64
#   postgres-password : openssl rand -base64 32
apiVersion: v1
kind: Secret
metadata:
  name: device-marker-secrets
type: Opaque
stringData:
  django-secret-key: "REPLACE_ME_64_RANDOM_CHARS"
  postgres-password: "REPLACE_ME_STRONG_PASSWORD"
